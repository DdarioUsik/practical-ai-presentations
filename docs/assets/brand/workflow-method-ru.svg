<text x="50" y="146" fill="#17213D" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="0">От разрозненных заметок</text>
<text x="50" y="195" fill="#17213D" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="0">к проверенному отчёту</text>
